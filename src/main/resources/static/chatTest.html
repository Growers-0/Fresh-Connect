<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chat Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<div>
  <input type="text" id="receiver" placeholder="받는사람 이메일">
  <button onclick="createRoom()">채팅방 생성</button>
</div>
<div>
  <input type="text" id="message" placeholder="메시지 입력">
  <button onclick="sendMessage()">전송</button>
</div>
<div id="messageArea"></div>

<script>
  let stompClient = null;
  let currentRoomId = null;

  // 웹소켓 연결
  function connect() {
    const socket = new SockJS('/ws/chat');
    stompClient = Stomp.over(socket);

    stompClient.connect({
      'Authorization': 'Bearer ' + 'your-jwt-token-here'  // JWT 토큰 넣기
    }, function(frame) {
      console.log('Connected: ' + frame);

      // 채팅방 응답 구독
      stompClient.subscribe('/user/queue/room', function(response) {
        const room = JSON.parse(response.body);
        currentRoomId = room.id;
        console.log('채팅방 생성됨:', room);
      });

      // 메시지 구독
      stompClient.subscribe('/user/queue/messages', function(message) {
        const received = JSON.parse(message.body);
        showMessage(received);
      });
    });
  }

  // 채팅방 생성
  function createRoom() {
    const receiver = document.getElementById('receiver').value;
    stompClient.send("/app/chat/room", {}, receiver);
  }

  // 메시지 전송
  function sendMessage() {
    const content = document.getElementById('message').value;
    const receiver = document.getElementById('receiver').value;

    const chatMessage = {
      type: 'TALK',
      roomId: currentRoomId,
      receiver: receiver,
      message: content
    };

    stompClient.send("/app/chat/message", {}, JSON.stringify(chatMessage));
    document.getElementById('message').value = '';
  }

  // 메시지 표시
  function showMessage(message) {
    const messageArea = document.getElementById('messageArea');
    const messageElement = document.createElement('div');
    messageElement.textContent = `${message.sender}: ${message.message}`;
    messageArea.appendChild(messageElement);
  }

  // 페이지 로드시 연결
  connect();
</script>
</body>
</html>
